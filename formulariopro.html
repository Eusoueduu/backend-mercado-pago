<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Contato</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1d3557, #457b9d);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff10;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #f1faee;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 15px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #ffffff15;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      color: #f1faee;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      transform: scale(1.3);
      accent-color: #e63946;
      cursor: pointer;
    }

    input[type="submit"] {
      background-color: #e63946;
      color: #fff;
      padding: 14px;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #d62828;
    }

    .thank-you {
      display: none;
      text-align: center;
      font-size: 18px;
      padding-top: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      input, select, textarea {
        font-size: 15px;
      }

      .checkbox-group label {
        font-size: 13.5px;
      }

      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Entre em Contato</h2>
    <form id="contatoForm" action="salvar.php" method="POST">
      <label for="empresa">Nome da Empresa</label>
      <input type="text" id="empresa" name="empresa" required />

      <label for="segmento">Segmento</label>
      <input type="text" id="segmento" name="segmento" required />

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" required />

      <label for="redesocial">Rede Social</label>
      <input type="url" id="redesocial" name="redesocial" placeholder="https://instagram.com/suaempresa" />

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" required />

      <label for="horario">Horário de Funcionamento</label>
      <input type="text" id="horario" name="horario" placeholder="Ex: Seg a Sex - 08h às 18h" required />

      <label for="cartoes">Cartões Aceitos</label>
      <input type="text" id="cartoes" name="cartoes" placeholder="Ex: Visa, MasterCard, Elo..." required />

      <label for="objetivo">Objetivo da Empresa</label>
      <textarea id="objetivo" name="objetivo" rows="3" required></textarea>

      <div class="checkbox-group">
        <label>
          <input type="checkbox" id="legalidade" name="legalidade" required />
          Declaro que a empresa atua dentro da legalidade.
        </label>
        <label>
          <input type="checkbox" id="compartilhamento" name="compartilhamento" required />
          Autorizo o compartilhamento dos dados com o banco de dados.
        </label>
      </div>

      <input type="submit" value="Enviar" />
    </form>

    <div class="thank-you" id="agradecimento">
      <p>✅ Suas informações foram recebidas!<br>Logo entraremos em contato.</p>
    </div>
  </div>

</body>
</html>
