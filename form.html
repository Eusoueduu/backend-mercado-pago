<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Contato</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1d3557, #457b9d);
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #ffffff10;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #f1faee;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    .checkbox-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #ffffff15;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      color: #f1faee;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      transform: scale(1.3);
      accent-color: #e63946;
      cursor: pointer;
    }

    input[type="submit"] {
      background-color: #e63946;
      color: #fff;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #d62828;
    }

    .thank-you {
      display: none;
      text-align: center;
      font-size: 18px;
      padding-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      input, select {
        font-size: 14px;
      }

      .checkbox-group label {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Formulário Grátis</h2>
    <form action="salvar.php" method="POST" id="contatoForm">
      <label for="empresa">Nome da Empresa</label>
      <input type="text" id="empresa" name="empresa" placeholder="Digite o nome da empresa" required />

      <label for="segmento">Segmento</label>
      <input type="text" id="segmento" name="segmento" placeholder="Ex: Alimentação, Construção..." required />

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required />

      <div class="checkbox-group">
        <label>
          <input type="checkbox" name="legalidade" required />
          Declaro que a empresa atua dentro da legalidade.
        </label>
        <label>
          <input type="checkbox" name="compartilhamento" required />
          Autorizo o compartilhamento dos dados pessoais da minha empresa.
        </label>
      </div>

      <input type="submit" value="Enviar" />
    </form>
  </div>

</body>
</html>
